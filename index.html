<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Train Time</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
  	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js" integrity="sha384-5AkRS45j4ukf+JbWAfHL8P4onPA9p0KwwP7pUdjSQA3ss9edbJUJc/XcYAiheSSz" crossorigin="anonymous"></script>
  	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
  	<link rel="stylesheet" type="text/css" href="assets/css/style.css">
	<link rel="stylesheet" type="text/css" href="assets/css/reset.css">
  
</head>
<body>
	<div class="jumbotron">
  		<h1>Train Time Tracker</h1>
  		<p><strong>keep track of different trains!</strong></p>
	</div>
	<div class="panel panel-primary">
  		<!-- Default panel contents -->
  		<div class="panel-heading">Current Train Schedule</div>

  		<!-- Table -->
  		<table class="table">
  			<tr >
  				<th>Train Name</th>
  				<th>Destination</th>
  				<th>Frequency (mins)</th>
  				<th>Next Arrival</th>
  				<th>Minutes Away</th>
  			</tr>
  		</table>
	</div>
	<div class="panel panel-primary">
  	<!-- Default panel contents -->
  		<div class="panel-heading">Panel heading</div>
		<form class="info-form">
  			<div class="form-group">
    			<label for="name">Train Name</label>
    			<input type="text" class="form-control" id="name">
  			</div>
  			<div class="form-group">
    			<label for="destination">Destination</label>
    			<input type="text" class="form-control" id="destination">
  			</div>
  			<div class="form-group">
    			<label for="time">First Train Time (HH:mm - military time)</label>
    			<input type="text" class="form-control" id="time">
  			</div>
  			<div class="form-group">
    			<label for="frequency">Frequency (min)</label>
    			<input type="text" class="form-control" id="frequency">
  			</div>
  			<button type="submit" class="submit btn btn-primary">Submit</button>
		</form>
	</div>

	<script type="text/javascript" src="assets/javascript/app.js"></script>


</body>
</html>
